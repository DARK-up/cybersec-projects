- id: ssti-jinja-arith
  category: ssti
  engine: jinja2_twig
  payload: "{{19*37}}"
  confirm_payload: "{{29*31}}"
  expect: "703"
  confirm_expect: "899"
  safe_scope: any
  risk_level: safe
  cwe: CWE-94
  tags: [arithmetic, multi-engine, non-destructive]
  description: Jinja2 / Twig arithmetic evaluation canary

