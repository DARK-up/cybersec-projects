- id: xss-html-script-canary
  category: xss
  engine: html_text
  payload: "<script>/*DARKXSS*/</script>"
  expect: "<script>/*DARKXSS*/</script>"
  safe_scope: any
  risk_level: safe
  cwe: CWE-79
  tags: [html, canary, non-executing]
  description: Non-alert script tag canary for context verification

- id: xss-attr-breakout-img
