[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-security-platform"
version = "4.0.0"
description = "DARK — Detection & Attack Reconnaissance Kit (Enterprise Security, Intelligence, Compliance & Governance Platform)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
distributed = [
    "celery>=5.4.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1.0",
    "boto3>=1.34.0",
]
capture = [
    "scapy>=2.5.0",
]
dev = [
    "pytest>=8.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
dark-api = "dark.main:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["dark*", "modules*", "webvulnx*", "netrecon*", "netsentry*", "hashbreaker*"]

[tool.setuptools.package-data]
dark = ["*.html", "*.png", "*.sh", "*.txt"]
webvulnx = ["payloads/**/*", "templates/**/*", "wordlists/**/*"]
modules = ["rules/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "webvulnx"]
python_files = ["test_*.py"]
